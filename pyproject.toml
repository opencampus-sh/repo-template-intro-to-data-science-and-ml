[project]
name = "bakery-sales-forecast"
version = "0.1.0"
description = "Team project: sales forecast for a bakery branch (Introduction to Data Science and Machine Learning, opencampus.sh)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "missingno>=0.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "tensorflow>=2.18",
]

[tool.uv]
package = false
